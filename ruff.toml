# Lint profile for this dictionary and its Python examples.
line-length = 79
indent-width = 4
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "Q", "W291", "W292", "W293"]

[lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
